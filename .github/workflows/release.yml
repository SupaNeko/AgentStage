name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: '版本号 (如 0.2.0，不需要加 v 前缀)'
        required: true
        type: string

jobs:
  release:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: lts/*

      - name: Setup pnpm
        uses: pnpm/action-setup@v3
        with:
          version: latest
          run_install: false

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install frontend dependencies
        run: pnpm install

      - name: Update version
        id: version
        shell: pwsh
        run: |
          $version = "${{ github.event.inputs.version }}"
          
          # Update package.json
          $pkg = Get-Content package.json -Raw | ConvertFrom-Json
          $pkg.version = $version
          $pkg | ConvertTo-Json -Depth 100 | Set-Content package.json
          
          # Update Cargo.toml (only in [package] section)
          $cargo = Get-Content src-tauri/Cargo.toml -Raw
          $cargo = $cargo -replace '(?m)^(\[package\][\s\S]*?^version) = ".*?"', "`$1 = `"$version`""
          Set-Content src-tauri/Cargo.toml $cargo
          
          # Update tauri.conf.json
          $conf = Get-Content src-tauri/tauri.conf.json -Raw | ConvertFrom-Json
          $conf.version = $version
          $conf | ConvertTo-Json -Depth 100 | Set-Content src-tauri/tauri.conf.json
          
          Write-Output "version=$version" >> $env:GITHUB_OUTPUT

      - name: Commit version bump
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add package.json src-tauri/Cargo.toml src-tauri/tauri.conf.json
          git diff --cached --quiet || git commit -m "release: bump version to ${{ steps.version.outputs.version }}"
          git push origin ${{ github.ref_name }}

      - name: Create tag
        run: |
          git tag v${{ steps.version.outputs.version }}
          git push origin v${{ steps.version.outputs.version }}

      - name: Build and release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: v${{ steps.version.outputs.version }}
          releaseName: 'AgentStage v${{ steps.version.outputs.version }}'
          releaseBody: ''
          releaseDraft: false
          prerelease: false

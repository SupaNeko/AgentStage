<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128">
  <defs>
    <filter id="darkwood" x="0%" y="0%" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.008 0.10" numOctaves="5" seed="19" stitchTiles="stitch" result="grain"/>
      <feColorMatrix type="matrix"
        values="0.15 0.04 0   0   0.22
                0.10 0.04 0   0   0.14
                0.06 0.02 0   0   0.08
                0    0    0   1   0"
        in="grain" result="colored"/>
      <feComponentTransfer in="colored">
        <feFuncA type="linear" slope="0.40"/>
      </feComponentTransfer>
    </filter>
  </defs>
  <rect width="128" height="128" filter="url(#darkwood)"/>
</svg>

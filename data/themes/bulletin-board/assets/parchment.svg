<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256">
  <defs>
    <filter id="paper" x="0%" y="0%" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.06 0.06" numOctaves="3" seed="5" stitchTiles="stitch" result="noise"/>
      <feColorMatrix type="matrix"
        values="0.04 0.02 0   0   0.91
                0.03 0.02 0   0   0.84
                0.02 0.02 0   0   0.74
                0    0    0   0   0"
        in="noise" result="tint"/>
      <feComponentTransfer in="tint">
        <feFuncA type="linear" slope="0.12"/>
      </feComponentTransfer>
    </filter>
  </defs>
  <rect width="256" height="256" filter="url(#paper)"/>
</svg>
